# Web 响应编码配置：统一使用 UTF-8，避免浏览器或接口工具显示中文乱码。
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8

# MySQL 数据库连接配置：这里连接本机 test 数据库。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis 配置：指定 XML 文件位置，并给实体类配置别名包。
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.demo.entity

# 启动时自动执行 schema.sql 和 data.sql，方便教学项目初始化。
spring.sql.init.mode=always

# 当前项目使用 HttpSession 保存登录态，所以前后端同域访问时会自动携带 JSESSIONID。
