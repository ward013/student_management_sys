<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理系统</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div>
            <p class="eyebrow">Campus Ops</p>
            <h1>学生管理系统</h1>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <main class="workspace">
        <section class="mission-strip">
            <div class="mission-copy">
                <p class="hero-label">Campus Identity Console</p>
                <h2>学生、老师与账号权限统一收口到一个控制台里。</h2>
            </div>
            <div class="mission-pills">
                <span class="signal-pill">学生工号 1-3</span>
                <span class="signal-pill">老师工号 1001-1002</span>
                <span class="signal-pill">管理员 admin / admin123</span>
            </div>
        </section>

        <section id="authView" class="grid two-col"></section>
        <section id="appView" class="app-view hidden"></section>
    </main>
</div>

<script src="/app.js"></script>
</body>
</html>
