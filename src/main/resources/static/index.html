<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理系统</title>
    <link rel="stylesheet" href="/app.css?v=20260608-1">
</head>
<body>
<div class="admin-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">S</div>
            <div>
                <strong>学生管理系统</strong>
                <span>Student Admin</span>
            </div>
        </div>
        <nav class="side-nav" aria-label="主导航">
            <a class="nav-item active" href="#overview" data-page="overview">
                <span class="nav-icon">⌂</span>
                <span>首页</span>
            </a>
            <div class="nav-group" data-nav-group="users">
                <div class="nav-group-title">
                    <span class="nav-icon">▦</span>
                    <span>账号</span>
                    <span class="nav-caret">⌃</span>
                </div>
                <a class="nav-item sub-item" href="#users" data-page="users">用户列表</a>
                <a class="nav-item sub-item" href="#users" data-page="users">账号编辑</a>
            </div>
            <div class="nav-group" data-nav-group="students">
                <div class="nav-group-title">
                    <span class="nav-icon">☷</span>
                    <span>学生</span>
                    <span class="nav-caret">⌃</span>
                </div>
                <a class="nav-item sub-item" href="#students" data-page="students">学生列表</a>
                <a class="nav-item sub-item" href="#students" data-page="students">学生维护</a>
            </div>
            <div class="nav-group" data-nav-group="teachers">
                <div class="nav-group-title">
                    <span class="nav-icon">◎</span>
                    <span>老师</span>
                    <span class="nav-caret">⌃</span>
                </div>
                <a class="nav-item sub-item" href="#teachers" data-page="teachers">老师列表</a>
                <a class="nav-item sub-item" href="#teachers" data-page="teachers">老师维护</a>
            </div>
            <div class="nav-group" data-nav-group="scores">
                <div class="nav-group-title">
                    <span class="nav-icon">≣</span>
                    <span>成绩</span>
                    <span class="nav-caret">⌃</span>
                </div>
                <a class="nav-item sub-item" href="#scores" data-page="scores">成绩列表</a>
                <a class="nav-item sub-item" href="#scores" data-page="scores">成绩维护</a>
            </div>
            <div class="nav-group" data-nav-group="requests">
                <div class="nav-group-title">
                    <span class="nav-icon">⚙</span>
                    <span>请求</span>
                    <span class="nav-caret">⌃</span>
                </div>
                <a class="nav-item sub-item" href="#requests" data-page="requests">请求中心</a>
            </div>
        </nav>
    </aside>

    <div class="main-shell">
        <header class="topbar">
            <div class="topbar-left">
                <button class="icon-button menu-button" type="button" aria-label="菜单">☰</button>
                <div class="breadcrumb">
                    <span>首页</span>
                    <span>/</span>
                    <strong>控制台</strong>
                </div>
            </div>
            <div class="topbar-actions" id="topbarActions"></div>
        </header>

        <main class="workspace">
            <section id="authView" class="auth-layout"></section>
            <section id="appView" class="app-view hidden"></section>
        </main>
    </div>
</div>

<script src="/app.js?v=20260608-1"></script>
</body>
</html>
